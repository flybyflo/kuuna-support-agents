name: kuuna-dev

services:
  node-deps:
    image: node:22-bookworm
    working_dir: /workspace
    command: >
      sh -c '
        npm install --include=optional &&
        case "$$(uname -m)" in
          aarch64|arm64) npm install --no-save --workspace @kuuna/dashboard lightningcss-linux-arm64-gnu @tailwindcss/oxide-linux-arm64-gnu ;;
          x86_64|amd64) npm install --no-save --workspace @kuuna/dashboard lightningcss-linux-x64-gnu @tailwindcss/oxide-linux-x64-gnu ;;
          *) echo "unsupported node dependency architecture: $$(uname -m)" >&2; exit 1 ;;
        esac
      '
    volumes:
      - ../..:/workspace
      - workspace_node_modules:/workspace/node_modules
      - dashboard_node_modules:/workspace/apps/dashboard/node_modules
      - dashboard_next:/workspace/apps/dashboard/.next
      - dashboard_next:/workspace/apps/dashboard/.next
      - backend_ts_node_modules:/workspace/services/backend-ts/node_modules
      - runtime_agent_node_modules:/workspace/services/runtime-agent-ts/node_modules
      - runtime_agent_contracts_node_modules:/workspace/packages/agent-contracts/node_modules

  dashboard:
    build:
      context: ../..
      dockerfile: apps/dashboard/Dockerfile.dev
    working_dir: /workspace
    command: >
      sh -c 'npm run dev --workspace @kuuna/dashboard -- --hostname "$${DASHBOARD_BIND_HOST:-::}" --port 3000'
    env_file:
      - path: ../env/dashboard.env.example
      - path: ../env/dashboard.env.local
        required: false
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ../..:/workspace
      - workspace_node_modules:/workspace/node_modules
      - dashboard_node_modules:/workspace/apps/dashboard/node_modules
    depends_on:
      node-deps:
        condition: service_completed_successfully
      backend:
        condition: service_healthy

  backend:
    build:
      context: ../..
      dockerfile: services/backend-ts/Dockerfile.dev
    working_dir: /workspace
    command: >
      sh -c 'npm run dev --workspace @kuuna/backend-ts'
    env_file:
      - path: ../env/backend.env.example
      - path: ../env/backend.env.local
        required: false
    environment:
      HOST: "::"
      PORT: "8000"
      WATCHFILES_FORCE_POLLING: "true"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ../..:/workspace
      - workspace_node_modules:/workspace/node_modules
      - backend_ts_node_modules:/workspace/services/backend-ts/node_modules
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      node-deps:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      runtime-agent:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8000/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  migrate:
    build:
      context: ../../backend
      dockerfile: Dockerfile.dev
    working_dir: /app
    command: sh -c "uv sync && uv run alembic upgrade head"
    env_file:
      - path: ../env/backend.env.example
      - path: ../env/backend.env.local
        required: false
    environment:
      UV_LINK_MODE: copy
    volumes:
      - ../../backend:/app
      - backend_venv:/app/.venv
    depends_on:
      postgres:
        condition: service_healthy

  backend-python:
    profiles: ["legacy-python-backend"]
    build:
      context: ../../backend
      dockerfile: Dockerfile.dev
    working_dir: /app
    command: sh -c 'uv sync && uv run python -m kuuna_backend.main'
    env_file:
      - path: ../env/backend.env.example
      - path: ../env/backend.env.local
        required: false
    environment:
      WATCHFILES_FORCE_POLLING: "true"
      UV_LINK_MODE: copy
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - ../../backend:/app
      - backend_venv:/app/.venv
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      runtime-agent:
        condition: service_started

  worker:
    build:
      context: ../..
      dockerfile: services/backend-ts/Dockerfile.dev
    working_dir: /workspace
    command: >
      sh -c 'npm run dev:worker --workspace @kuuna/backend-ts'
    env_file:
      - path: ../env/backend.env.example
      - path: ../env/backend.env.local
        required: false
    environment:
      WATCHFILES_FORCE_POLLING: "true"
      TEMPLATE_BUILD_CONTEXT_PATH: /workspace
      TEMPLATE_BUILD_DOCKERFILE_PATH: services/runtime-agent-ts/Dockerfile
    volumes:
      - ../..:/workspace
      - workspace_node_modules:/workspace/node_modules
      - backend_ts_node_modules:/workspace/services/backend-ts/node_modules
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      node-deps:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      runtime-agent:
        condition: service_started

  worker-python:
    profiles: ["legacy-python-backend"]
    build:
      context: ../../backend
      dockerfile: Dockerfile.dev
    working_dir: /app
    # Migrations are owned by the `backend` service to avoid concurrent DDL / enum races.
    command: sh -c "uv sync && uv run watchfiles --filter python 'uv run rq worker default' src"
    env_file:
      - path: ../env/backend.env.example
      - path: ../env/backend.env.local
        required: false
    environment:
      WATCHFILES_FORCE_POLLING: "true"
      UV_LINK_MODE: copy
      TEMPLATE_BUILD_CONTEXT_PATH: /workspace
      TEMPLATE_BUILD_DOCKERFILE_PATH: services/runtime-agent-ts/Dockerfile
    volumes:
      - ../..:/workspace
      - ../../backend:/app
      - worker_venv:/app/.venv
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      runtime-agent:
        condition: service_started

  todo-exporter:
    profiles: ["legacy-python-backend"]
    build:
      context: ../../backend
      dockerfile: Dockerfile.dev
    working_dir: /app
    command: sh -c 'uv sync && while true; do uv run python -m kuuna_backend.jobs.todo_export; sleep 600; done'
    env_file:
      - path: ../env/backend.env.example
      - path: ../env/backend.env.local
        required: false
    environment:
      WATCHFILES_FORCE_POLLING: "true"
      UV_LINK_MODE: copy
    volumes:
      - ../../backend:/app
      - todo_exporter_venv:/app/.venv
    depends_on:
      postgres:
        condition: service_healthy

  runtime-agent:
    image: kuuna-runtime-agent-ts:dev
    build:
      context: ../..
      dockerfile: services/runtime-agent-ts/Dockerfile.dev
    working_dir: /workspace/services/runtime-agent-ts
    command: sh -c "npm run dev"
    env_file:
      - path: ../env/backend.env.example
      - path: ../env/backend.env.local
        required: false
    environment:
      WATCHFILES_FORCE_POLLING: "true"
      UV_LINK_MODE: copy
      RUNTIME_AGENT_DEFAULT_MODEL: "gpt-5.5"
      RUNTIME_AGENT_REASONING_EFFORT: "medium"
    ports:
      - "127.0.0.1:8100:8100"
    volumes:
      - ../..:/workspace
      - workspace_node_modules:/workspace/node_modules
      - runtime_agent_node_modules:/workspace/services/runtime-agent-ts/node_modules
      - runtime_agent_contracts_node_modules:/workspace/packages/agent-contracts/node_modules
    depends_on:
      node-deps:
        condition: service_completed_successfully

  gateway:
    build:
      context: ../../services/gateway
      dockerfile: Dockerfile.dev
    working_dir: /app
    command: sh -c 'uv sync && uv run watchfiles --filter python "uv run python src/app.py" src'
    env_file:
      - path: ../env/gateway.env.example
      - path: ../env/gateway.env.local
        required: false
    environment:
      WATCHFILES_FORCE_POLLING: "true"
    ports:
      - "127.0.0.1:8090:8090"
    volumes:
      - ../../services/gateway:/app
      - gateway_venv:/app/.venv
      - gateway_session:/data
    depends_on:
      backend:
        condition: service_healthy

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: kuuna
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kuuna"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: miniopassword
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data

volumes:
  dashboard_node_modules:
  dashboard_next:
  workspace_node_modules:
  backend_ts_node_modules:
  backend_venv:
  worker_venv:
  todo_exporter_venv:
  runtime_agent_node_modules:
  runtime_agent_contracts_node_modules:
  gateway_venv:
  gateway_session:
  postgres_data:
  minio_data:

networks:
  default:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_icc: "true"
