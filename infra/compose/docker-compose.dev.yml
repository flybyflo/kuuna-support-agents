name: kuuna-dev

services:
  dashboard:
    build:
      context: ../../apps/dashboard
      dockerfile: Dockerfile.dev
    working_dir: /app
    command: sh -c "npm install && rm -rf .next && npm run dev -- --hostname 0.0.0.0 --port 3000"
    env_file:
      - ../env/dashboard.env.example
    ports:
      - "3000:3000"
    volumes:
      - ../../apps/dashboard:/app
      - dashboard_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_started

  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile.dev
    working_dir: /app
    command: sh -c "uv sync && uv run alembic upgrade head && uv run uvicorn kuuna_backend.main:app --host 0.0.0.0 --port 8000 --reload"
    env_file:
      - ../env/backend.env.example
      - ../env/backend.env.local
    environment:
      WATCHFILES_FORCE_POLLING: "true"
    ports:
      - "8000:8000"
    volumes:
      - ../../backend:/app
      - backend_venv:/app/.venv
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      runtime-agent:
        condition: service_started

  worker:
    build:
      context: ../../backend
      dockerfile: Dockerfile.dev
    working_dir: /app
    # Migrations are owned by the `backend` service to avoid concurrent DDL / enum races.
    command: sh -c "uv sync && uv run watchfiles --filter python 'uv run rq worker default' src"
    env_file:
      - ../env/backend.env.example
      - ../env/backend.env.local
    environment:
      WATCHFILES_FORCE_POLLING: "true"
      TEMPLATE_BUILD_CONTEXT_PATH: /template-build-context
    volumes:
      - ../../backend:/app
      - worker_venv:/app/.venv
      - /var/run/docker.sock:/var/run/docker.sock
      - ../../infra/runtime/template-agent:/template-build-context:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      runtime-agent:
        condition: service_started

  runtime-agent:
    build:
      context: ../../services/runtime-agent
      dockerfile: Dockerfile
    working_dir: /app
    command: sh -c "uv sync && uv run uvicorn app:app --app-dir src --host 0.0.0.0 --port 8100 --reload"
    env_file:
      - ../env/backend.env.example
      - ../env/backend.env.local
    environment:
      WATCHFILES_FORCE_POLLING: "true"
    ports:
      - "8100:8100"
    volumes:
      - ../../services/runtime-agent:/app
      - /var/run/docker.sock:/var/run/docker.sock

  gateway:
    build:
      context: ../../services/gateway
      dockerfile: Dockerfile.dev
    working_dir: /app
    command: sh -c 'uv sync && uv run watchfiles --filter python "uv run python src/app.py" src'
    env_file:
      - ../env/gateway.env.example
    environment:
      WATCHFILES_FORCE_POLLING: "true"
    volumes:
      - ../../services/gateway:/app
      - gateway_venv:/app/.venv
      - gateway_session:/data
    depends_on:
      backend:
        condition: service_started

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: kuuna
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kuuna"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: miniopassword
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  dashboard_node_modules:
  backend_venv:
  worker_venv:
  gateway_venv:
  gateway_session:
  postgres_data:
  minio_data:
