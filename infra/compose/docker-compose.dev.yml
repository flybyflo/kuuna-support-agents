name: kuuna-dev

services:
  dashboard:
    build:
      context: ../..
      dockerfile: apps/dashboard/Dockerfile.dev
    working_dir: /workspace
    command: >
      sh -c '
        npm install --include=optional &&
        case "$$(uname -m)" in
          aarch64|arm64) npm install --no-save --workspace @kuuna/dashboard lightningcss-linux-arm64-gnu @tailwindcss/oxide-linux-arm64-gnu ;;
          x86_64|amd64) npm install --no-save --workspace @kuuna/dashboard lightningcss-linux-x64-gnu @tailwindcss/oxide-linux-x64-gnu ;;
          *) echo "unsupported dashboard architecture: $$(uname -m)" >&2; exit 1 ;;
        esac &&
        npm run dev --workspace @kuuna/dashboard -- --hostname 0.0.0.0 --port 3000
      '
    env_file:
      - path: ../env/dashboard.env.example
      - path: ../env/dashboard.env.local
        required: false
    ports:
      - "3000:3000"
    volumes:
      - ../..:/workspace
      - workspace_node_modules:/workspace/node_modules
      - dashboard_node_modules:/workspace/apps/dashboard/node_modules
    depends_on:
      backend:
        condition: service_healthy

  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile.dev
    working_dir: /app
    command: sh -c "uv sync && uv run alembic upgrade head && uv run uvicorn kuuna_backend.main:app --host 0.0.0.0 --port 8000 --reload"
    env_file:
      - path: ../env/backend.env.example
      - path: ../env/backend.env.local
        required: false
    environment:
      WATCHFILES_FORCE_POLLING: "true"
      UV_LINK_MODE: copy
    ports:
      - "8000:8000"
    volumes:
      - ../../backend:/app
      - backend_venv:/app/.venv
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      runtime-agent:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "uv",
          "run",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()",
        ]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  backend-ts:
    build:
      context: ../..
      dockerfile: services/backend-ts/Dockerfile.dev
    working_dir: /workspace
    command: >
      sh -c '
        npm install --include=optional &&
        npm run dev --workspace @kuuna/backend-ts
      '
    env_file:
      - path: ../env/backend.env.example
      - path: ../env/backend.env.local
        required: false
    environment:
      HOST: "0.0.0.0"
      PORT: "8010"
      WATCHFILES_FORCE_POLLING: "true"
    ports:
      - "8010:8010"
    volumes:
      - ../..:/workspace
      - workspace_node_modules:/workspace/node_modules
      - backend_ts_node_modules:/workspace/services/backend-ts/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker-ts:
    profiles: ["backend-ts-cutover"]
    build:
      context: ../..
      dockerfile: services/backend-ts/Dockerfile.dev
    working_dir: /workspace
    command: >
      sh -c '
        npm install --include=optional &&
        npm run dev:worker --workspace @kuuna/backend-ts
      '
    env_file:
      - path: ../env/backend.env.example
      - path: ../env/backend.env.local
        required: false
    environment:
      WATCHFILES_FORCE_POLLING: "true"
    volumes:
      - ../..:/workspace
      - workspace_node_modules:/workspace/node_modules
      - backend_ts_node_modules:/workspace/services/backend-ts/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ../../backend
      dockerfile: Dockerfile.dev
    working_dir: /app
    # Migrations are owned by the `backend` service to avoid concurrent DDL / enum races.
    command: sh -c "uv sync && uv run watchfiles --filter python 'uv run rq worker default' src"
    env_file:
      - path: ../env/backend.env.example
      - path: ../env/backend.env.local
        required: false
    environment:
      WATCHFILES_FORCE_POLLING: "true"
      UV_LINK_MODE: copy
      TEMPLATE_BUILD_CONTEXT_PATH: /workspace
      TEMPLATE_BUILD_DOCKERFILE_PATH: services/runtime-agent-ts/Dockerfile
    volumes:
      - ../..:/workspace
      - ../../backend:/app
      - worker_venv:/app/.venv
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      runtime-agent:
        condition: service_started

  todo-exporter:
    build:
      context: ../../backend
      dockerfile: Dockerfile.dev
    working_dir: /app
    command: sh -c 'uv sync && while true; do uv run python -m kuuna_backend.jobs.todo_export; sleep 600; done'
    env_file:
      - path: ../env/backend.env.example
      - path: ../env/backend.env.local
        required: false
    environment:
      WATCHFILES_FORCE_POLLING: "true"
      UV_LINK_MODE: copy
    volumes:
      - ../../backend:/app
      - todo_exporter_venv:/app/.venv
    depends_on:
      postgres:
        condition: service_healthy

  runtime-agent:
    image: kuuna-runtime-agent-ts:dev
    build:
      context: ../..
      dockerfile: services/runtime-agent-ts/Dockerfile.dev
    working_dir: /workspace/services/runtime-agent-ts
    command: sh -c "npm install && npm run dev"
    env_file:
      - path: ../env/backend.env.example
      - path: ../env/backend.env.local
        required: false
    environment:
      WATCHFILES_FORCE_POLLING: "true"
      UV_LINK_MODE: copy
      RUNTIME_AGENT_DEFAULT_MODEL: "gpt-5.5"
      RUNTIME_AGENT_REASONING_EFFORT: "medium"
    ports:
      - "8100:8100"
    volumes:
      - ../..:/workspace
      - runtime_agent_node_modules:/workspace/services/runtime-agent-ts/node_modules
      - runtime_agent_contracts_node_modules:/workspace/packages/agent-contracts/node_modules

  gateway:
    build:
      context: ../../services/gateway
      dockerfile: Dockerfile.dev
    working_dir: /app
    command: sh -c 'uv sync && uv run watchfiles --filter python "uv run python src/app.py" src'
    env_file:
      - path: ../env/gateway.env.example
      - path: ../env/gateway.env.local
        required: false
    environment:
      WATCHFILES_FORCE_POLLING: "true"
    ports:
      - "8090:8090"
    volumes:
      - ../../services/gateway:/app
      - gateway_venv:/app/.venv
      - gateway_session:/data
    depends_on:
      backend:
        condition: service_healthy

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: kuuna
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kuuna"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: miniopassword
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  dashboard_node_modules:
  workspace_node_modules:
  backend_ts_node_modules:
  backend_venv:
  worker_venv:
  todo_exporter_venv:
  runtime_agent_node_modules:
  runtime_agent_contracts_node_modules:
  gateway_venv:
  gateway_session:
  postgres_data:
  minio_data:
