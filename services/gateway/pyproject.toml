[project]
name = "kuuna-gateway"
version = "0.1.0"
description = "Kuuna WhatsApp gateway service"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "neonize>=0.3.13",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "mypy>=1.20.1",
    "pytest>=9.0.3",
    "ruff>=0.15.11",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = ["neonize.*", "google.protobuf.*"]
ignore_missing_imports = true
