[project]
name = "kuuna-runtime-agent"
version = "0.1.0"
description = "Kuuna runtime agent API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.136.0",
  "httpx>=0.28.1",
  "pydantic>=2.13.0",
  "uvicorn[standard]>=0.44.0",
]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.uv]
package = false

[dependency-groups]
dev = [
  "pytest>=9.0.3",
  "ruff>=0.15.11",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
